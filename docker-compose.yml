services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rakshacall
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: raksha_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d rakshacall"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://raksha:raksha_dev_password@db:5432/rakshacall
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
